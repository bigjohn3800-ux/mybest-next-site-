function wrapTables(root){

async function exportResultCsv(){

 const lines=[head.map(esc2).join(',')];
 /* [FIX-A2 2026-08-02] 학생별 조회 실패를 catch(e){}로 삼켜 일부 학생이 조용히 누락되던 문제.
    실패를 집계해 완료 시 알리고, 순차 왕복을 6건 배치 병렬로 바꿔 대기 시간을 줄인다. */
 const __fail=[]; const __res=new Array(rows.length); const __B=6;
 for(let b0=0;b0<rows.length;b0+=__B){
  const seg=rows.slice(b0,b0+__B);

 for(let i=0;i<rows.length;i++){

   (j.attempts||[]).forEach(a=>lines.push([studentNo(r,i),r.name,r.school||'',r.class_name||'',r.grade||'',TITLES[a.test_slug]||a.test_slug,a.created_at?a.created_at.slice(0,10):'',summarize(a.test_slug,a.result).replace(/<[^>]+>/g,''),(r.done||0)+'/'+(r.total||14)].map(esc2).join(',')));
  }catch(e){__fail.push(r.name||('학생'+(i+1)));}
 }
 if(__fail.length)alert('일부 학생의 결과를 불러오지 못해 CSV에서 빠졌습니다 ('+__fail.length+'명)\n'+__fail.slice(0,8).join(', ')+(__fail.length>8?' 외':'')+'\n\n네트워크 상태를 확인하고 다시 시도해 주세요.');
 const blob=new Blob(['﻿'+lines.join('\r\n')],{type:'text/csv;charset=utf-8'});
 const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='mybest_result_values_'+new Date().toISOString().slice(0,10)+'.csv';document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);
}
// 2026-07-30: 계층형 필터(지역→학교급→학교→학년→학급). 상위 선택에 따라 하위 드롭다운 옵션을 좁힌다.
// school_level/region/학년 정보가 없는(=미지정) 기존 학급도 "미지정" 옵션으로 항상 접근 가능(데이터가 사라진 것처럼 보이지 않게).
// 강제 순서가 아니라 좁혀나가는 보조 도구 — 지역을 건너뛰고 바로 학교를 선택해도 정상 동작.
function fCascadeSel(){
 return { region:$('#fRegion')?.value||'', level:$('#fLevel')?.value||'', school:$('#fSchool')?.value||'', grade:$('#fGrade')?.value||'' };
}
function fCascadeCandidates(upto, sel){
 const order=['region','level','school','grade'];
 const idx=order.indexOf(upto);
 const apply=idx<0?order.length:idx; // upto 이전 단계까지만 상위 조건 적용(자기 자신 제외)
 return (S.filters&&S.filters.classes||[]).filter(c=>{
  for(let i=0;i<apply;i++){
   const k=order[i], v=sel[k];
   if(!v) continue;
   if(k==='region'){ if(v==='__none__'){ if(c.region) return false; } else if(c.region!==v) return false; }
   else if(k==='level'){ if(v==='__none__'){ if(c.school_level) return false; } else if(c.school_level!==v) return false; }
   else if(k==='school'){ if(c.school!==v) return false; }
   else if(k==='grade'){ if(v==='__none__'){ if((c.grades||[]).length) return false; } else if(!(c.grades||[]).includes(v)) return false; }
  }
  return true;
 });
}
function fOptsHtml(values,curVal,allLabel,hasNone){
 const arr=[...values].sort((a,b)=>String(a).localeCompare(String(b),'ko'));
 let html=`<option value="">${esc(allLabel)}</option>`+arr.map(v=>`<option${v===curVal?' selected':''}>${esc(v)}</option>`).join('');
 if(hasNone) html+=`<option value="__none__"${curVal==='__none__'?' selected':''}>미지정</option>`;
 return html;
}
function rebuildFilterCascade(){
 if(!S.filters)return;
 const sel=fCascadeSel();
 const allCls=S.filters.classes||[];
 const forLevel=fCascadeCandidates('level',sel);   // region 조건까지만 → 학교급 옵션
 const forSchool=fCascadeCandidates('school',sel);  // region+학교급 → 학교 옵션
 const forGrade=fCascadeCandidates('grade',sel);    // region+학교급+학교 → 학년 옵션
 const forClass=fCascadeCandidates('class',sel);    // 전부 적용 → 학급 옵션

 const rgHasNone=allCls.some(c=>!c.region);
 const lvHasNone=forLevel.some(c=>!c.school_level);
 const scSet=new Set(forSchool.map(c=>c.school).filter(Boolean));
 const grSet=new Set(); forGrade.forEach(c=>(c.grades||[]).forEach(g=>grSet.add(g)));
 const grHasNone=forGrade.some(c=>!(c.grades||[]).length);

 // 2026-07-31: 지역/학교급은 실제 데이터 유무와 무관하게 항상 고정 마스터 리스트(17개 시도 / 초·중·고·학원) 전체를 보여준다.
 $('#fRegion').innerHTML=fOptsHtmlFixed(REGIONS_17,sel.region,'전체 지역',rgHasNone);
 $('#fLevel').innerHTML=fOptsHtmlFixed(LEVELS_4,sel.level,'전체 학교급',lvHasNone);
 $('#fSchool').innerHTML=fOptsHtml(scSet,sel.school,'전체 학교',false);
 $('#fGrade').innerHTML=fOptsHtml(grSet,sel.grade,'전체 학년',grHasNone);
 const curClassCode=$('#fClass')?.value||'';
 const clsSorted=forClass.slice().sort((a,b)=>String(a.name).localeCompare(String(b.name),'ko'));
 $('#fClass').innerHTML='<option value="">전체 학급</option>'+clsSorted.map(c=>`<option value="${esc(c.code)}"${c.code===curClassCode?' selected':''}>${esc(c.name)} (${esc(c.code)})${c.school?' · '+esc(c.school):''}</option>`).join('');
 // 상위 조건 변경으로 더 이상 유효하지 않은 하위 선택값은 리셋(마스터 리스트 자체엔 항상 존재하므로 region/level은 리셋 대상에서 제외)
 if(sel.school && !scSet.has(sel.school)) $('#fSchool').value='';
 if(sel.grade && sel.grade!=='__none__' && !grSet.has(sel.grade)) $('#fGrade').value='';
 if(curClassCode && !clsSorted.some(c=>c.code===curClassCode)) $('#fClass').value='';
}

// ── 학교단위 KPI + 학급별 비교 (웨이브4-D) ──
function aggClasses(rows){
 // /overview students[] 를 학급(class_name+school) 단위로 집계
 const m=new Map();
 rows.forEach(r=>{
  // [FIX 2026-08-03 · B2] 학교명+학급명으로 묶으면 동명 학급이 한 줄로 합쳐진다.
  // 실제로 '마베테스트' 학급 2개(13명/2명), '3학년2반' 2개가 합쳐져 완료율이 어긋났다.
  const key=r.class_id?('id:'+r.class_id):((r.school||'')+'|'+(r.class_name||'(미지정)'));
  let g=m.get(key);
  if(!g){g={key,school:r.school||'-',cls:r.class_name||'(미지정)',grade:r.grade||'',level:r.school_level||'',region:r.region||'',n:0,done:0,attempts:0,active:0,c5:0};m.set(key,g);}
  g.n++; g.done+=(r.done||0); g.attempts+=(r.attempts||0);
  if((r.done||0)>=1)g.active++;
  if((r.done||0)>=5)g.c5++;
  if(!g.grade&&r.grade)g.grade=r.grade;
  if(!g.level&&r.school_level)g.level=r.school_level;
  if(!g.region&&r.region)g.region=r.region;
 });
 return [...m.values()].map(g=>({
  ...g,
  avgDone:g.n?Math.round((g.done/g.n)*10)/10:0,
  rate:g.n?Math.round((g.active/g.n)*100):0,
  c5rate:g.n?Math.round((g.c5/g.n)*100):0
 }));
}

function applyCmpFilter(){
 if(!S.cmp)return[];
 const rg=$('#cmpFilterRegion')?.value||'';
 const lv=$('#cmpFilterLevel')?.value||'';
 const sc=$('#cmpFilterSchool')?.value||'';
 return S.cmp.allGroups.filter(g=>{
  if(rg){ if(rg==='__none__'){ if(g.region) return false; } else if(g.region!==rg) return false; }
  if(lv){ if(lv==='__none__'){ if(g.level) return false; } else if(g.level!==lv) return false; }
  if(sc && g.school!==sc) return false;
  return true;
 });
}

function updCmpFilter(){
 if(!S.cmp)return;
 const rg=$('#cmpFilterRegion')?.value||'';
 const lv=$('#cmpFilterLevel')?.value||'';
 const passRegion=(g)=>{ if(!rg) return true; if(rg==='__none__') return !g.region; return g.region===rg; };
 const passLevel=(g)=>{ if(!lv) return true; if(lv==='__none__') return !g.level; return g.level===lv; };
 const forSchool=(S.cmp.allGroups||[]).filter(g=>passRegion(g)&&passLevel(g));
 const scSet=[...new Set(forSchool.map(g=>g.school).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ko'));
 const scSel=$('#cmpFilterSchool');
 if(scSel){
  const cur=scSel.value;
  scSel.innerHTML='<option value="">전체 학교</option>'+scSet.map(s=>`<option${s===cur?' selected':''}>${esc(s)}</option>`).join('');

 }
 S.cmp.groups=applyCmpFilter();
 sortCompare(S.cmp.sort.key,true);
}

function sortCompare(key,keepDir){
 if(!S.cmp)return;
 const st=S.cmp.sort;
 if(keepDir){st.key=key;}
 else{if(st.key===key)st.dir*=-1;else{st.key=key;st.dir=(key==='cls'||key==='school')?1:-1;}}
 const num=!(key==='cls'||key==='school');
 const g=[...S.cmp.groups].sort((a,b)=>{
  let x=a[key],y=b[key];
  if(num){x=+x;y=+y;return (x-y)*st.dir;}
  return String(x).localeCompare(String(y),'ko')*st.dir;
 });
 const arrow=k=>st.key===k?(st.dir<0?' ▾':' ▴'):'';
 const tot={n:g.reduce((a,r)=>a+r.n,0),attempts:g.reduce((a,r)=>a+r.attempts,0),done:g.reduce((a,r)=>a+r.done,0),c5:g.reduce((a,r)=>a+r.c5,0)};

   <th class="num" onclick="sortCompare('c5rate')">5종+율${arrow('c5rate')}</th></tr></thead>`;
 const bar=p=>`<span class="minibar"><i style="width:${Math.max(2,Math.min(100,p))}%"></i></span>`;
 const body='<tbody>'+g.map(r=>`<tr>

   <td class="num">${bar(r.c5rate)}${r.c5rate}%</td></tr>`).join('')+
  `<tr class="totalrow"><td class="cls">전체 (${g.length}학급)</td><td>-</td><td class="num">${tot.n}</td><td class="num">${tot.attempts}</td><td class="num">${totAvg}</td><td class="num">${totRate}%</td><td class="num">${totC5}%</td></tr></tbody>`;

}

// 2026-07-30: "새 학급 발급"에서 지역을 수동으로도 고를 수 있는 17개 시/도 드롭다운(NEIS 자동캡처 값으로 미리 채우되 수동 변경 허용).
const REGIONS_17=['서울','부산','대구','인천','광주','대전','울산','세종','경기','강원','충북','충남','전북','전남','경북','경남','제주'];
// 2026-07-31: 학교급 고정 마스터 리스트(초/중/고/학원). DB엔 자유텍스트로 이 4개 값 중 하나를 그대로 저장한다(코드화 불필요).
const LEVELS_4=['초등','중등','고등','학원'];
function normRegion(raw){
 const s=String(raw||'').trim();
 if(!s)return '';
 const map=[['서울','서울'],['부산','부산'],['대구','대구'],['인천','인천'],['광주','광주'],['대전','대전'],['울산','울산'],['세종','세종'],['경기','경기'],['강원','강원'],['충청북','충북'],['충북','충북'],['충청남','충남'],['충남','충남'],['전라북','전북'],['전북','전북'],['전라남','전남'],['전남','전남'],['경상북','경북'],['경북','경북'],['경상남','경남'],['경남','경남'],['제주','제주']];
 for(const [needle,short] of map){ if(s.includes(needle)) return short; }
 return '';
}
// NEIS schoolLevel(예: "초등학교"/"중학교"/"고등학교")을 고정 마스터 값으로 정규화.
function normLevel(raw){
 const s=String(raw||'').trim();
 if(!s)return '';
 if(s.includes('초등'))return '초등';
 if(s.includes('중학')||s.includes('중등'))return '중등';
 if(s.includes('고등'))return '고등';
 if(s.includes('학원'))return '학원';
 return '';
}

 return html;
}

function ccSchoolInit(){
 const inp=$('#ccSchool'),list=$('#ccSchoolList');
 if(!inp||!list||inp.dataset.bound)return;
 inp.dataset.bound='1';
 let items=[],timer=null,seq=0;
 const API='https://onqisdgxwuvlxehjvoto.supabase.co/functions/v1/myb-school';
 function parseRegion(addr){ if(!addr)return ''; return String(addr).trim().split(/\s+/)[0]||''; }
 function render(){
  if(!items.length){list.style.display='none';list.innerHTML='';return;}
  list.innerHTML=items.map((it,i)=>`<li data-idx="${i}" style="padding:8px 10px;cursor:pointer;border-radius:6px;font-size:13px">${esc(it.name)} <span class="muted" style="font-size:11px">(${esc(it.schoolLevel||'')})</span><br><span class="muted" style="font-size:11px">${esc(it.addr||'')}</span></li>`).join('');
  list.style.display='block';
  [...list.children].forEach((el,i)=>{
   el.addEventListener('mouseover',()=>{el.style.background='#F1EEFF'});
   el.addEventListener('mouseout',()=>{el.style.background=''});
   el.addEventListener('click',()=>select(items[i]));
  });
 }
 function select(it){
  inp.value=it.name;
  const rg=normRegion(it.addr)||parseRegion(it.addr);
  S.selectedSchoolInfo={name:it.name,schoolLevel:it.schoolLevel||'',region:rg};
  const rgSel=$('#ccRegion'); if(rgSel){ const norm=normRegion(it.addr); if(norm) rgSel.value=norm; }
  const lvSel=$('#ccLevel'); if(lvSel){ const nlv=normLevel(it.schoolLevel); if(nlv) lvSel.value=nlv; }
  list.style.display='none';list.innerHTML='';
 }
 inp.addEventListener('input',()=>{
  S.selectedSchoolInfo=null;
  const v=inp.value.trim();
  if(timer)clearTimeout(timer);
  if(v.length<2){items=[];render();return;}
  timer=setTimeout(async ()=>{
   const mySeq=++seq;
   try{
    const r=await fetch(API+'/search?name='+encodeURIComponent(v));
    const d=await r.json();
    if(mySeq!==seq)return;
    items=(d&&d.ok!==false&&d.results)||[];
    render();
   }catch(e){items=[];render();}
  },280);
 });
 document.addEventListener('click',(e)=>{if(list&&!list.contains(e.target)&&e.target!==inp)list.style.display='none';});
}

function updBkClassOptions(){
 const all=S.bulkClasses||[];
 // 2026-07-31: 지역/학교급 드롭다운은 데이터 유무와 무관하게 항상 고정 마스터 리스트(17개 시도 / 초·중·고·학원) 전체를 보여준다.
 const rgSel=$('#bkFilterRegion');
 if(rgSel&&!rgSel.dataset.init){ rgSel.dataset.init='1'; const hasNone=all.some(c=>!c.region); rgSel.innerHTML=fOptsHtmlFixed(REGIONS_17,'','전체 지역',hasNone); }
 const lvSel=$('#bkFilterLevel');
 if(lvSel&&!lvSel.dataset.init){ lvSel.dataset.init='1'; const hasNone=all.some(c=>!c.school_level); lvSel.innerHTML=fOptsHtmlFixed(LEVELS_4,'','전체 학교급',hasNone); }
 const rg=$('#bkFilterRegion')?.value||'';
 const lv=$('#bkFilterLevel')?.value||'';
 const passRegion=(c)=>{ if(!rg) return true; if(rg==='__none__') return !c.region; return c.region===rg; };
 const passLevel=(c)=>{ if(!lv) return true; if(lv==='__none__') return !c.school_level; return c.school_level===lv; };
 // 학교 옵션: 지역+학교급까지만 적용해 좁힌다
 const forSchool=all.filter(c=>passRegion(c)&&passLevel(c));
 const scSet=[...new Set(forSchool.map(c=>c.school).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ko'));
 const scSel=$('#bkFilterSchool');
 if(scSel){
  const cur=scSel.value;
  scSel.innerHTML='<option value="">전체 학교</option>'+scSet.map(s=>`<option${s===cur?' selected':''}>${esc(s)}</option>`).join('');
  if(cur&&!scSet.includes(cur))scSel.value='';
 }
 const scVal=$('#bkFilterSchool')?.value||'';
 const forGrade=forSchool.filter(c=>!scVal||c.school===scVal);
 // 학년 옵션: 지역+학교급+학교까지 적용해 좁힌다 (학급별 grades[] 목록 — /filters 응답 기반)
 const grSet=new Set(); forGrade.forEach(c=>(c.grades||[]).forEach(g=>grSet.add(g)));

 }
 const grVal=$('#bkFilterGrade')?.value||'';
 const passGrade=(c)=>{ if(!grVal) return true; if(grVal==='__none__') return !(c.grades||[]).length; return (c.grades||[]).includes(grVal); };

 updBkCode();
}

 ws['!cols']=[{wch:16}];

function uploadBulkExcel(ev){
 const file=ev.target.files&&ev.target.files[0];if(!file)return;
 if(typeof XLSX==='undefined'){alert('엑셀 기능을 불러오는 중입니다. 잠시 후 다시 시도해주세요.');return}
 const reader=new FileReader();
 reader.onload=(e)=>{
  try{
   const wb=XLSX.read(e.target.result,{type:'array'});
   const sheet=wb.Sheets[wb.SheetNames[0]];
   const rows=XLSX.utils.sheet_to_json(sheet,{header:1});
   const names=rows.map(r=>String((r&&r[0])??'').trim()).filter(n=>n&&n!=='이름'&&n.toLowerCase()!=='name');
   if(!names.length){alert('엑셀에서 이름을 찾지 못했습니다. 첫 번째 열(A열)에 이름을 한 줄씩 넣어주세요.');return}
   const ta=$('#bkNames');
   const existing=ta.value.split(/\r?\n/).map(s=>s.trim()).filter(Boolean);
   ta.value=[...existing,...names].join('\n');
   ta.dispatchEvent(new Event('input'));
   alert(names.length+'명을 엑셀에서 불러왔습니다. 등록 전에 명단을 확인해주세요.');
  }catch(err){alert('엑셀 파일을 읽는 중 오류가 발생했습니다: '+err.message);}
  ev.target.value='';
 };
 reader.readAsArrayBuffer(file);
}

// ── 비밀번호 변경 (본인 / super는 타인 초기화) ──

/* [F-PATCH 2026-08-03 · R11] A10 비밀번호 강도 표시
   색만으로 알려주면 색각 이상인 분이 구분하지 못한다. 글자를 함께 적는다. */
function pwScore(v){
  var n=0;
  if(v.length>=8)n++; if(v.length>=12)n++;
  if(/[A-Za-z]/.test(v)&&/\d/.test(v))n++;
  if(/[^A-Za-z0-9]/.test(v))n++;
  return Math.min(n,4);
}
function pwMeter(){
  var el=document.getElementById('pwNew'); if(!el)return;
  var v=el.value||'', sc=pwScore(v);
  var nm=['너무 짧아요','약함','보통','안전','매우 안전'][sc];
  var cl=['s0','s1','s2','s3','s4'][sc];
  var bar=document.getElementById('pwBar');
  if(bar){ bar.className='pwbar '+cl; var i=bar.querySelector('i'); if(i)i.style.width=(sc*25)+'%'; }
  var h=document.getElementById('pwHint');
  if(h){
    var m=document.getElementById('pwNew2');
    var same=(m&&m.value)?(m.value===v?' · 확인 일치':' · 확인 불일치'):'';
    h.textContent=(v?('안전도: '+nm):'8자 이상 · 영문과 숫자를 섞으면 더 안전합니다')+same;
  }
}
function pwReveal(on){
  ['pwOld','pwNew','pwNew2'].forEach(function(id){
    var e=document.getElementById(id); if(e)e.type=on?'text':'password';
  });
}
function openChangePassword(targetUsername){
 const isReset=!!targetUsername;
 $('#sheet').innerHTML=`<div class="topbar"><h2 style="font-size:19px">비밀번호 ${isReset?'초기화':'변경'}</h2><div class="spacer"></div><button class="btn navy sm" onclick="closeModal()">닫기</button></div>
  ${isReset?`<div class="notice"><b>${esc(targetUsername)}</b> 계정의 비밀번호를 초기화합니다.</div>`:''}
  ${isReset?'':'<label>현재 비밀번호</label><input id="pwOld" type="password"><div style="height:8px"></div>'}
  <label>새 비밀번호</label><input id="pwNew" type="password" placeholder="8자 이상" autocomplete="new-password" aria-describedby="pwHint" oninput="pwMeter()">
  <div id="pwBar" class="pwbar" aria-hidden="true"><i></i></div>
  <div id="pwHint" class="muted" style="font-size:12px;margin-top:4px">8자 이상 · 영문과 숫자를 섞으면 더 안전합니다</div>
  <div style="height:8px"></div>
  <label>새 비밀번호 확인</label><input id="pwNew2" type="password" autocomplete="new-password" oninput="pwMeter()">
  <div style="height:6px"></div>
  <label style="display:flex;align-items:center;gap:6px;font-weight:600;font-size:12.5px;cursor:pointer"><input type="checkbox" onchange="pwReveal(this.checked)" style="width:auto;margin:0"> 비밀번호 보기</label>
  <div style="height:14px"></div>
  <button class="btn" style="width:100%" onclick="doChangePassword(${isReset?`'${targetUsername}'`:'null'})">저장</button>
  <div id="pwResult" style="margin-top:10px"></div>`;
 $('#modal').classList.add('open');

async function doChangePassword(targetUsername){
 const n1=$('#pwNew')?.value||'',n2=$('#pwNew2')?.value||'';
 // [F-PATCH 2026-08-03 · R11] A10 최소 길이 4 → 8. 기존 비밀번호로 로그인하는 것은 그대로 되고,
 //  '바꿀 때'만 8자 이상을 요구한다. 서버(/change_password)도 같은 기준으로 맞추는 것이 좋다.
 if(n1.length<8){$('#pwResult').innerHTML='<div class="err" style="display:block">새 비밀번호는 8자 이상이어야 합니다.</div>';return}
 if(/^(\d)\1+$/.test(n1)||/^(0123|1234|2345|3456|4567|5678|6789|abcd|qwer)/i.test(n1)){$('#pwResult').innerHTML='<div class="err" style="display:block">같은 숫자 반복이나 연속된 문자는 쓸 수 없습니다.</div>';return}
 if(n1!==n2){$('#pwResult').innerHTML='<div class="err" style="display:block">새 비밀번호가 일치하지 않습니다.</div>';return}
 const body={token:S.token,new_password:n1};
 if(targetUsername)body.target_username=targetUsername;else body.old_password=$('#pwOld')?.value||'';
 $('#pwResult').innerHTML='<div class="muted" style="font-size:12.5px">저장 중…</div>';
 const j=await api('/change_password',body);
 if(j.error){$('#pwResult').innerHTML=`<div class="err" style="display:block">${esc(j.error)}</div>`;return}
 $('#pwResult').innerHTML='<div class="notice ok">비밀번호가 변경되었습니다.</div>';
}

   "몇 개월 연장" 단축 버튼을 추가. /inst_update 는 이미 usage_end 패치를 지원하므로
   새 백엔드 없이, 여기서 개월수만큼 날짜를 계산해 usage_end 로 저장한다. */
async function doInstExtend(id){
 const months=+($('#iExtendMonths')?.value||12);
 const cur=$('#iEnd')?.value||'';
 const base=cur?new Date(cur+'T00:00:00'):new Date();
 const now=new Date();
 const from=base>now?base:now;
 from.setMonth(from.getMonth()+months);
 const next=from.toISOString().slice(0,10);
 $('#iExtendResult').innerHTML='<div class="muted" style="font-size:12.5px">연장 중…</div>';
 const j=await api('/inst_update',{token:S.token,id,patch:{usage_end:next}});
 if(j.error){$('#iExtendResult').innerHTML=`<div class="err" style="display:block">${esc(j.error)}</div>`;return}
 const endEl=$('#iEnd'); if(endEl)endEl.value=next;
 $('#iExtendResult').innerHTML=`<div class="notice ok">연장되었습니다. 새 종료일: ${esc(next)}</div>`;
}

/* ── [N-03 2026-08-03] 학교 교육과정 편제표 ──────────────────────────────
   "추천받은 과목이 우리 학교에 없다" 가 과목추천의 가장 흔한 실패였다.
   학교가 개설 과목을 한 번 등록해두면 결과지에서 개설/미개설이 자동으로 갈린다.
   서버: mybest v43 GET/POST /api/school_subjects.
   POST 는 그 학교 편제표를 통째로 교체한다(편제표는 해마다 통으로 바뀐다) —
   그래서 저장 전에 반드시 현재 개수를 먼저 보여주고 학교명 재입력을 받는다. */
const SS_CATS=['공통','일반선택','진로선택','융합선택','기타'];
const SS_MAX=400;
const SSX={rows:[],dups:0,header:'',existing:null,exKey:'',exOpen:false};
// 서버 norm() 과 같은 규칙 — 공백·괄호 제거 후 소문자.
function ssKey(v){return String(v==null?'':v).replace(/[\s()（）]/g,'').toLowerCase();}
function ssVal(id){const e=$(id);return e?String(e.value||'').trim():'';}

function ssCat(v){
 const s=String(v==null?'':v).replace(/\s/g,'');
 if(!s)return '';
 if(SS_CATS.indexOf(s)>=0)return s;
 if(/^공통(과목)?$/.test(s))return '공통';
 if(/^일반(선택)?(과목)?$/.test(s))return '일반선택';
 if(/^진로(선택)?(과목)?$/.test(s))return '진로선택';
 if(/^융합(선택)?(과목)?$/.test(s))return '융합선택';
 if(/^기타/.test(s))return '기타';
 return s; /* 표준 분류가 아니면 그대로 두고 표에서 눈에 띄게 표시한다(서버는 빈값으로 저장). */
}
/* 1 · 1,2 · 2-3 · 2~3 · 1학년 · 전학년 · 공통 … 을 모두 받는다. */
function ssGrades(v){
 const raw=String(v==null?'':v).replace(/\s/g,'');
 if(!raw)return '';
 /* '전학년' 은 '학년' 을 떼기 전에 먼저 본다 — 떼고 나면 '전' 만 남는다. */
 if(/전학년|전체|모든/.test(raw))return '1,2,3';
 if(/공통/.test(raw))return '공통';
 const s=raw.replace(/학년/g,'').replace(/[·ㆍ‧・/]/g,',').replace(/[~∼〜–—]/g,'-');
 const out=[];
 s.split(',').forEach(function(tok){
  if(!tok)return;
  const m=tok.match(/^(\d)-(\d)$/);
  if(m){let a=+m[1],b=+m[2];if(a>b){const t=a;a=b;b=t;}for(let i=a;i<=b;i++){if(out.indexOf(String(i))<0)out.push(String(i));}return;}
  if(out.indexOf(tok)<0)out.push(tok);
 });
 return out.join(',').slice(0,20);
}
const SS_HEAD=/^(과목|과목명|교과목|교과목명|교과|교과영역|영역|계열|학년|이수학년|개설학년|비고|메모|참고|개설|개설여부|subject|category|grade|grades|note|remark)$/i;
function ssIsHeader(cells){
 const first=String(cells[0]||'').replace(/\s/g,'');
 return SS_HEAD.test(first);
}
/* 탭(엑셀 복사)·쉼표 둘 다 받는다. 열이 1개뿐이면 나머지는 빈값 — 가장 흔한 케이스다. */
function ssParse(text){
 const lines=String(text||'').split(/\r?\n/);
 const rows=[];const seen=Object.create(null);let dups=0;let header='';
 for(let i=0;i<lines.length;i++){
  const raw=lines[i];
  if(!String(raw).replace(/[\s,\t]/g,''))continue;
  let cells=(raw.indexOf('\t')>=0?raw.split('\t'):raw.split(','));
  cells=cells.map(function(c){return String(c).replace(/^\s*["']|["']\s*$/g,'').trim();});
  while(cells.length>1&&!cells[cells.length-1])cells.pop();
  if(!cells[0])continue;
  if(!rows.length&&!header&&ssIsHeader(cells)){header=cells.join(' | ');continue;}
  let subject=cells[0].slice(0,60),category='',grades='',note='',isOpen=true;
  if(cells.length===2){
   const c2=cells[1].replace(/\s/g,'');
   if(SS_CATS.indexOf(ssCat(c2))>=0)category=cells[1];
   else if(/[0-9]|학년|전학년|전체|공통/.test(c2))grades=cells[1];
   else category=cells[1];
  }else if(cells.length>=3){
   category=cells[1]||'';grades=cells[2]||'';note=cells[3]||'';
   if(cells.length>=5)isOpen=!/^(n|no|false|0|x|미개설|폐강|미개|아니오|없음)$/i.test(cells[4].replace(/\s/g,''));
  }
  if(seen[subject]){dups++;continue;}
  seen[subject]=1;
  rows.push({subject:subject,category:ssCat(category),grades:ssGrades(grades),note:String(note||'').slice(0,120),is_open:isOpen});
 }
 return {rows:rows,dups:dups,header:header};
}

function csKst(v){

 const s=String(v);
 const d=/[Zz]$|[+\-]\d\d:?\d\d$/.test(s)?new Date(s):new Date(s.replace(' ','T')+'Z');

 return `${p.year}-${p.month}-${p.day} ${p.hour}:${p.minute}`;
}

 if(j.error){$('#csTbody').innerHTML=`<tr><td colspan="8" class="err" style="display:table-cell">${esc(j.error)}</td></tr>`;return}
 S.csRows=j.rows||[];S.csCounts=j.counts||{};S.csPending=Number(j.pending_real||0);

 if(sel&&sel.options.length<=1){(j.types||[]).forEach(t=>{const o=document.createElement('option');o.value=t;o.textContent=t;sel.appendChild(o);});sel.value=ty||'';}

function downloadSubjectTemplate(){
 if(typeof XLSX==='undefined'){alert('엑셀 기능을 불러오는 중입니다. 잠시 후 다시 시도해주세요.');return}

  ['공통국어1','공통','1',''],
  ['독서와 작문','일반선택','2',''],
  ['주제 탐구 독서','진로선택','2-3','격년 개설'],
 ]);
 ws['!cols']=[{wch:20},{wch:12},{wch:10},{wch:16}];
 const wb=XLSX.utils.book_new();
 XLSX.utils.book_append_sheet(wb,ws,'편제표');
 XLSX.writeFile(wb,'마이베스트_학급편제표_양식.xlsx');
}
function uploadSubjectExcel(ev){
 const file=ev.target.files&&ev.target.files[0];if(!file)return;
 if(typeof XLSX==='undefined'){alert('엑셀 기능을 불러오는 중입니다. 잠시 후 다시 시도해주세요.');return}
 const reader=new FileReader();
 reader.onload=(e)=>{
  try{
   const wb=XLSX.read(e.target.result,{type:'array'});
   const sheet=wb.Sheets[wb.SheetNames[0]];
   const rows=XLSX.utils.sheet_to_json(sheet,{header:1});
   const lines=rows.map(r=>(r||[]).map(c=>String(c??'').trim()).join('\t')).filter(l=>l.replace(/\t/g,'').length>0);
   if(!lines.length){alert('엑셀에서 내용을 찾지 못했습니다. 과목명(·교과·학년·비고) 열을 확인해주세요.');return}
   const ta=$('#ssText');
   if(ta){ta.value=lines.join('\n');ssConvert();}
   alert(lines.length+'줄을 엑셀에서 불러왔습니다. 미리보기에서 확인 후 저장하세요.');
  }catch(err){alert('엑셀 파일을 읽는 중 오류가 발생했습니다: '+err.message);}
  ev.target.value='';
 };
 reader.readAsArrayBuffer(file);
}
function ssConvert(){
 const t=$('#ssText');
 const r=ssParse(t?t.value:'');
 SSX.rows=r.rows;SSX.dups=r.dups;SSX.header=r.header;
 ssRenderPreview();
}
function ssCatSelect(i,v){
 const bad=!!v&&SS_CATS.indexOf(v)<0;
 let o=`<option value=""${v?'':' selected'}>(없음)</option>`;
 SS_CATS.forEach(function(c){o+=`<option${v===c?' selected':''}>${c}</option>`;});
 if(bad)o+=`<option value="${esc(v)}" selected>${esc(v)} · 표준 분류 아님</option>`;
 return `<select style="width:auto;min-width:118px;padding:6px 8px;font-size:12px${bad?';border-color:var(--danger-text)':''}" onchange="ssSet(${i},'category',this.value)">${o}</select>`;
}
function ssRenderPreview(){
 const box=$('#ssPreview');if(!box)return;
 const rows=SSX.rows;
 if(!rows.length){box.innerHTML='';ssRenderSave();return}
 const bad=rows.filter(function(r){return r.category&&SS_CATS.indexOf(r.category)<0}).length;
 box.innerHTML=`<div class="card noprint">
  <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px">
   <b>붙여넣기 미리보기</b>
   <span class="muted" id="ssCounts" style="font-size:12.5px;font-variant-numeric:tabular-nums">${ssCountText()}</span>
   <button class="btn ghost sm" style="margin-left:auto" onclick="ssConvert()">다시 변환</button></div>
  ${SSX.header?`<div class="muted" style="font-size:12px;margin-bottom:6px">머리글로 보고 건너뛴 줄 — ${esc(SSX.header)}</div>`:''}
  ${SSX.dups?`<div class="muted" style="font-size:12px;margin-bottom:6px">같은 과목명 ${SSX.dups}줄은 중복이라 제외했습니다.</div>`:''}
  ${bad?`<div class="notice" style="margin-bottom:10px">교과 값 <b>${bad}</b>개가 표준 분류(${SS_CATS.join(' · ')})가 아닙니다. 그대로 저장하면 <b>교과가 빈값</b>으로 들어갑니다. 표에서 직접 골라 주세요.</div>`:''}
  <div class="tablewrap"><table style="font-variant-numeric:tabular-nums">
   <thead><tr><th style="width:44px">#</th><th>과목명</th><th style="width:150px">교과</th><th style="width:82px">학년</th><th>비고</th><th style="width:64px">개설</th><th style="width:64px"></th></tr></thead>
   <tbody>${rows.map(function(r,i){
    return `<tr><td class="muted" style="font-size:12px">${i+1}</td>
    <td style="font-weight:700">${esc(r.subject)}</td>
    <td>${ssCatSelect(i,r.category)}</td>
    <td style="font-size:12px">${esc(r.grades||'-')}</td>
    <td class="muted" style="font-size:12px">${esc(r.note||'')}</td>
    <td style="text-align:center"><input type="checkbox" style="width:auto;margin:0" ${r.is_open===false?'':'checked'} title="개설 여부" aria-label="${esc(r.subject)} 개설 여부" onchange="ssSet(${i},'is_open',this.checked)"></td>
    <td><button class="btn ghost sm" title="이 줄 삭제" onclick="ssDel(${i})">삭제</button></td></tr>`;
   }).join('')}</tbody></table></div>
  <div class="muted" style="font-size:12px;margin-top:8px;line-height:1.7">개설 체크를 끄면 <b>미개설로 등록</b>됩니다(목록에서 빼는 것과 다릅니다 — 학생에게 "우리 학교에는 없는 과목"이라고 알려 줍니다).</div>
 </div>`;
 ssRenderSave();
}
function ssCountText(){
 const n=SSX.rows.length;
 const openN=SSX.rows.filter(function(r){return r.is_open!==false}).length;
 return `${n}개 인식 · 개설 ${openN} · 미개설 ${n-openN}`;
}
function ssSet(i,k,v){
 if(!SSX.rows[i])return;
 SSX.rows[i][k]=v;
 /* 교과를 고치면 "표준 분류 아님" 경고 수가 달라지므로 표를 다시 그린다. */
 if(k==='category'){ssRenderPreview();return}
 const c=$('#ssCounts');if(c)c.textContent=ssCountText();
 ssRenderSave();
}
function ssDel(i){
 if(!SSX.rows[i])return;
 SSX.rows.splice(i,1);
 ssRenderPreview();
}
/* 저장 패널 — 여기가 이 화면의 안전장치다.
   ① 기존 개수를 조회하기 전에는 저장 버튼 자체를 만들지 않는다.
   ② 400개 초과는 서버까지 가기 전에 막는다.
   ③ 기존보다 절반 아래로 줄면 크게 경고한다(붙여넣기가 잘린 사고가 가장 흔하다).
   ④ 마지막에 학교명을 손으로 다시 입력해야 버튼이 열린다. confirm() 은 쓰지 않는다. */
function ssRenderSave(){
 const box=$('#ssSave');if(!box)return;
 const rows=SSX.rows,n=rows.length,name=ssVal('#ssSchool');
 if(!n){box.innerHTML='';return}
 if(n>SS_MAX){
  box.innerHTML=`<div class="card noprint"><div class="err" style="display:block;font-size:13px">
   과목이 <b style="font-variant-numeric:tabular-nums">${n}</b>개입니다. 한 번에 최대 ${SS_MAX}개까지만 저장할 수 있어 <b>${n-SS_MAX}개 초과</b>했습니다.
   표에서 ${n-SS_MAX}줄을 지운 뒤 다시 시도해 주세요.</div></div>`;
  return;
 }
 const loaded=!!name&&!!SSX.existing&&SSX.exKey===ssKey(name);
 if(!loaded){
  box.innerHTML=`<div class="card noprint"><div class="notice">저장은 이 학교의 편제표를 <b>통째로 교체</b>합니다. 먼저 위에서 <b>현재 편제표 조회</b>를 눌러 지금 몇 개가 들어 있는지 확인해 주세요.</div></div>`;
  return;
 }
 const cur=((SSX.existing.subjects)||[]).length;
 const shrink=cur>0&&n<cur;
 const bigDrop=cur>0&&n<cur/2;
 box.innerHTML=`<div class="card noprint">
  <b>저장 — 편제표 전체 교체</b>
  <div class="notice ${bigDrop?'':'ok'}" style="margin-top:8px;font-variant-numeric:tabular-nums;font-size:13px">
   <b>${esc(name)}</b> · 현재 <b>${cur}</b>개 &nbsp;→&nbsp; 새로 <b>${n}</b>개
   ${shrink?` (${cur-n}개 줄어듦)`:(cur?` (${n-cur}개 늘어남)`:'')}
   ${cur?'<div style="margin-top:5px">저장하면 기존 '+cur+'개는 모두 지워지고 새 '+n+'개로 바뀝니다.</div>':'<div style="margin-top:5px">이 학교의 첫 등록입니다.</div>'}</div>
  ${bigDrop?`<div class="err" style="display:block;font-size:13px;font-variant-numeric:tabular-nums">
   <b>확인해 주세요.</b> 새 목록(${n}개)이 지금 등록된 것(${cur}개)의 절반도 되지 않습니다.
   엑셀에서 일부만 복사됐거나 붙여넣기가 잘린 것은 아닌지 다시 보시고, 맞다면 그대로 진행하셔도 됩니다.</div>`:''}
  <label style="margin-top:10px">확인 — 저장할 학교명을 그대로 입력하세요</label>
  <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
   <input id="ssConfirm" style="flex:1 1 240px" autocomplete="off" placeholder="${esc(name)}" oninput="ssCheckConfirm()">
   <button class="btn" id="ssSaveBtn" disabled style="opacity:.45;cursor:not-allowed" onclick="ssSave()">편제표 ${n}개로 교체 저장</button></div>
  <div class="muted" style="font-size:12px;margin-top:6px">표를 고치면 확인 입력이 초기화됩니다. 마지막으로 본 내용 그대로 저장되도록 하기 위해서입니다.</div>
  <div id="ssSaveResult" style="margin-top:12px"></div>
 </div>`;
 ssCheckConfirm();
}
function ssCheckConfirm(){
 const b=$('#ssSaveBtn');if(!b)return;
 const name=ssVal('#ssSchool');
 const ok=!!name&&ssKey(ssVal('#ssConfirm'))===ssKey(name);
 b.disabled=!ok;b.style.opacity=ok?'1':'.45';b.style.cursor=ok?'pointer':'not-allowed';
}
async function ssSave(){
 const name=ssVal('#ssSchool'),rows=SSX.rows,n=rows.length;
 if(!name||!n||n>SS_MAX)return;
 if(ssKey(ssVal('#ssConfirm'))!==ssKey(name))return;
 const b=$('#ssSaveBtn');if(b){b.disabled=true;b.style.opacity='.45';b.style.cursor='not-allowed'}
 const res=$('#ssSaveResult');if(res)res.innerHTML='<div class="muted" style="font-size:12.5px"><span class="spinner"></span>저장 중…</div>';
 const subjects=rows.map(function(r){
  return {subject:r.subject,category:SS_CATS.indexOf(r.category)>=0?r.category:'',grades:r.grades||'',note:r.note||'',is_open:r.is_open!==false};
 });
 let j;
 try{
  const r=await fetch(APP+'/api/school_subjects',{method:'POST',headers:{'Content-Type':'application/json',apikey:KEY},body:JSON.stringify({admin_token:S.token,school:name,subjects:subjects})});
  j=await r.json();
 }catch(e){j={error:'네트워크 오류가 발생했습니다. 다시 시도해 주세요.'}}
 if(j&&j.error){
  if(isAuthErr(j.error)){logout('세션이 만료되었습니다. 다시 로그인해 주세요.');return}
  const r2=$('#ssSaveResult');if(r2)r2.innerHTML=`<div class="err" style="display:block">${esc(j.error)}</div>`;
  ssCheckConfirm();return;
 }
 const saved=j.saved||0,skipped=j.skipped||0;
 await ssLoad();
 const done=`<div class="notice ok" style="font-variant-numeric:tabular-nums"><b>저장 완료</b> · ${esc(j.school||name)} 편제표가 <b>${saved}</b>개로 교체되었습니다.${skipped?' (빈 과목·중복 '+skipped+'개 제외)':''}</div>`;
 const slot=$('#ssSaveResult')||$('#ssExBox');
 if(slot)slot.innerHTML=done+(slot.id==='ssExBox'?slot.innerHTML:'');
}

(async function boot(){
 try{
  if(S.token&&await restoreStoredSession())await viewDash();
  else viewLogin();
 }catch(e){clearStoredAdminSession();viewLogin('세션 확인 중 오류가 발생했습니다. 다시 로그인해 주세요.');}
})();
</script>
</body></html>
