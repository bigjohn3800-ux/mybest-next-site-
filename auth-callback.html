<!doctype html>
<html lang="en" data-eduverse-callback="mybestnext-v2">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="referrer" content="no-referrer">
  <title>EDUVERSE Sign-in | MyBest NEXT</title>
</head>
<body>
  <main aria-live="polite">
    <h1>Connecting your sign-in</h1>
    <p id="status">Checking your session securely.</p>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://eduverse.mybestedu.ai/assets/env.js"></script>
  <script src="https://eduverse.mybestedu.ai/assets/eduverse-auth.js"></script>
  <script>
  (function () {
    'use strict';
    var inHub = location.pathname.indexOf('/s/mybestnext/') === 0;
    var home = inHub ? '/s/mybestnext/' : '/';
    var callbackPath = inHub
      ? '/s/mybestnext/auth-callback.html'
      : '/auth-callback.html';
    var status = document.getElementById('status');

    function scrubCallbackUrl() {
      history.replaceState(null, '', callbackPath);
    }

    function failClosed() {
      scrubCallbackUrl();
      status.textContent = 'Sign-in could not be completed. Please start again from EDUVERSE.';
    }

    if (!window.EduverseAuth || !window.EduverseAuth.configured) {
      scrubCallbackUrl();
      status.textContent = 'Sign-in configuration is unavailable.';
      return;
    }

    window.EduverseAuth.getUser().then(function (sessionUser) {
      if (!sessionUser) throw new Error('session_required');
      scrubCallbackUrl();
      location.replace(home);
    }).catch(failClosed);
  })();
  </script>
</body>
</html>
